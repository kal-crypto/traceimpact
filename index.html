<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraceImpact - Impact Engine</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .badge { background: rgba(16, 185, 129, 0.2); color: var(--accent); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.8rem; border: 1px solid var(--accent); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem; }
        .card-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.5rem; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .progress-bg { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 0.8rem 0; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s; }
        
        #console-log { background: #000; color: #00ff00; padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-bottom: 2rem; max-height: 150px; overflow-y: auto; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="logo">TraceImpact</div>
        <div class="badge" id="statusBadge">Connecting API...</div>
    </header>

    <h3 style="margin-bottom: 0.5rem; color: var(--text-sub);">System Diagnostics Log:</h3>
    <div id="console-log">> Initializing TraceImpact Engine...<br></div>

    <h2 style="margin-top: 1rem;">Active Live Projects</h2>
    <div class="grid" id="projectsContainer">
        <div style="grid-column: 1 / -1; color: var(--text-sub);">Loading data feeds...</div>
    </div>

    <script>
        function logToScreen(msg) {
            console.log(msg);
            const logger = document.getElementById('console-log');
            if (logger) {
                logger.innerHTML += `> ${msg}<br>`;
                logger.scrollTop = logger.scrollHeight;
            }
        }

        const API_KEY = "34135ad6-dbad-46e2-b68c-e772304c861c";
        const DIRECT_URL = `https://api.globalgiving.org/api/public/projectservice/all/projects/active?api_key=${API_KEY}`;
        const PROXY_URL = `https://api.allorigins.win/raw?url=` + encodeURIComponent(DIRECT_URL);

        async function loadProjects() {
            logToScreen("Fetching from GlobalGiving via CORS Proxy bridge...");
            const container = document.getElementById('projectsContainer');
            const badge = document.getElementById('statusBadge');

            try {
                // Fetch via Proxy to bypass CORS lock completely
                const response = await fetch(PROXY_URL);
                if (!response.ok) throw new Error(`HTTP Status ${response.status}`);
                
                const data = await response.json();
                logToScreen("API Data successfully received!");
                
                let rawList = data.projects && data.projects.project ? data.projects.project : [];
                let projects = Array.isArray(rawList) ? rawList : [rawList];

                if (projects.length === 0) {
                    throw new Error("No projects found in API response.");
                }

                badge.innerText = "Live API Active";
                logToScreen(`Rendering ${projects.length} live project cards...`);
                renderProjects(projects);

            } catch (err) {
                logToScreen(`API Notice: ${err.message}`);
                logToScreen("Engaging high-availability local trace dataset...");
                badge.innerText = "Demo Pipeline Mode";
                badge.style.borderColor = "#f59e0b";
                badge.style.color = "#f59e0b";
                renderFallbackProjects();
            }
        }

        function renderProjects(projects) {
            const container = document.getElementById('projectsContainer');
            container.innerHTML = '';

            projects.slice(0, 9).forEach(p => {
                const goal = p.goal || 10000;
                const raised = p.funding || 0;
                const pct = Math.min(Math.round((raised / goal) * 100), 100);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>GG-${p.id || 'N/A'}</span>
                        <span>${p.country || 'Global'}</span>
                    </div>
                    <div class="card-title">${p.title || 'Untitled Impact Project'}</div>
                    <p style="font-size: 0.85rem; color: var(--text-sub);">${p.summary ? p.summary.substring(0, 90) + '...' : 'Live project telemetry active.'}</p>
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${pct}%;"></div>
                    </div>
                    <div style="display:flex; justify-between; font-size: 0.8rem; color: var(--text-sub);">
                        <span>$${Number(raised).toLocaleString()} raised</span>
                        <span style="margin-left: auto;">${pct}%</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderFallbackProjects() {
            const sample = [
                { id: "8821", country: "Kenya", title: "Solar Borehole & Clean Water Station #4", funding: 15000, goal: 15000, summary: "Constructing solar-powered clean water access nodes for community health verification." },
                { id: "9042", country: "Bangladesh", title: "Emergency Medical Relief Kit Distribution", funding: 8200, goal: 10000, summary: "First-aid micro-logistics tracking for local disaster management checkpoints." },
                { id: "7104", country: "Peru", title: "High-Altitude Reforestation Pipeline", funding: 4500, goal: 12000, summary: "Geotagged sapling planting tracking verified via weekly satellite imagery." }
            ];
            renderProjects(sample);
        }

        window.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
